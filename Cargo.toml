[workspace]
members = ["xtask", "quickgpu",  "discover_exports", "example"]
exclude = ["discover_exports/test_workspace"]
resolver = "2"

[workspace.dependencies]
syn = { version = "2.0.106", features = ["full", "extra-traits", "visit", "visit-mut"] }
anyhow = "1.0.100"
bon = "3.8.1"
bytemuck = "1.24.0"
clap = "4.5.48"
convert_case = "0.8.0"
discover_exports = { path = "discover_exports" }
duct = "1.1.0"
env_logger = "0.11.8"
fixedbitset = "0.5.7"
log = "0.4.28"
petgraph = "0.8.3"
pollster = "0.4.0"
proc-macro2 = "1.0.101"
quickgpu = { path = "quickgpu" }
quote = "1.0.41"
wgpu = "27.0.1"
winit = "0.30.12"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

