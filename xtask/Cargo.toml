[package]
name = "xtask"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
clap = { version ="4.5.47", features=["derive"] }
convert_case = "0.8.0"
duct = "1.1.0"
env_logger = "0.11.8"
log = "0.4.28"
prettyplease = "0.2.37"
proc-macro2 = "1.0.101"
quote = "1.0.40"
rustdoc-json = "0.9.7"
rustdoc-types = "0.56.0"
serde_json = "1.0.143"
syn = { version = "2.0.106", features = ["full", "extra-traits"] }
