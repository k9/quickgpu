[package]
name = "xtask"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
cargo_metadata = "0.22.0"
clap = { version ="4.5.47", features=["derive"] }
convert_case = "0.8.0"
html5ever = "0.35.0"
jsonpath-rust = "1.0.4"
prettyplease = "0.2.37"
proc-macro2 = "1.0.101"
quote = "1.0.40"
rustdoc-json = "0.9.7"
scraper = "0.24.0"
serde_json = "1.0.143"
syn = { version = "2.0.106", features = ["full"] }
urlencoding = "2.1.3"
winnow = "0.7.13"
